<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传</title>
</head>
<body>
    <form id="uploadForm">
        <input type="file" id="fileInput" name="file" accept="*">
        <button type="button" onclick="uploadFile()">上传文件</button>
    </form>

    <script>
        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0]; // 获取选中的文件

            if (!file) {
                alert('请选择一个文件！');
                return;
            }

            const formData = new FormData(); // 创建FormData对象
            formData.append('file', file); // 将文件添加到FormData对象中

            const xhr = new XMLHttpRequest(); // 创建XMLHttpRequest对象
            xhr.open('POST', '/upload', true); // 设置请求类型、URL和是否异步

            xhr.onload = function () {
                if (xhr.status === 200) {
                    alert('文件上传成功！');
                    console.log(xhr.responseText); // 显示服务器返回的信息（如果有的话）
                } else {
                    alert('文件上传失败！');
                }
            };

            xhr.send(formData); // 发送请求，并传递FormData对象作为请求体
        }
    </script>
</body>
</html>
